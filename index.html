<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cajas Rurales</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<meta name="theme-color" content="#12142B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cajas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<style>
:root{
  --bg:#12142B; --card:#1C1F3D; --line:#2B2F55; --line2:#262A4D; --chip:#3A3F6B;
  --ink:#F2F3FF; --mut:#A6A9C8; --mut2:#C9CBE6;
  --morado:#5B4BDB; --moradoTx:#E9E6FF; --sel:#2A2666;
  --amarillo:#FFD166; --rojo:#FF8A7E; --rojoBg:#47232F; --verde:#5FE0B0; --verdeBg:#173B3A;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
#app{height:100%}
.scr{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 24px)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h1.m{font-size:22px}
.cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ib svg{width:20px;height:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.topL{display:flex;align-items:center;gap:12px}
.acts{display:flex;gap:8px}
.fecha{font-size:13px;color:var(--mut);font-weight:600}
.tarjeta{width:100%;text-align:left;background:var(--morado);border:2px solid var(--morado);border-radius:24px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
.tarjeta.sel{border-color:var(--amarillo)}
.tarjeta .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--moradoTx)}
.tarjeta .big{font-weight:800;letter-spacing:-.03em;line-height:1.15}
.tarjeta .sub{font-size:13px;font-weight:600;color:var(--moradoTx)}
.fila2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.caja{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.caja.sel{border-color:var(--amarillo)}
.caja .n{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--mut2)}
.punto{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.caja .v{font-weight:800;letter-spacing:-.02em}
.secH{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.secH h2{margin:0;font-size:15px;font-weight:700}
.secH span{font-size:13px;color:var(--mut);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--chip);background:transparent;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lista{border-top:1px solid var(--line2)}
.mov{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.desliza{position:relative;overflow:hidden}
.desliza .mov{position:relative;background:var(--bg);touch-action:pan-y;transition:transform .2s ease}
.desliza.mueve .mov{transition:none}
.borrar{position:absolute;top:0;right:0;bottom:1px;width:96px;border:0;background:#C93B4A;color:#fff;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.borrar svg{width:20px;height:20px}
button.mov:active{background:#171A36}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:18px;height:18px}
.ic.r{background:var(--rojoBg);color:var(--rojo)} .ic.a{background:var(--verdeBg);color:var(--verde)}
.ic.r svg{transform:rotate(180deg)}
.mt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.mt .t{font-size:15px;font-weight:700}
.s{font-size:12.5px;font-weight:600;color:var(--mut)}
.mm{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.mm .m{font-size:15px;font-weight:800}
.m.r,.rojo{color:var(--rojo)} .m.a,.verde{color:var(--verde)}
.vacio{margin:0;padding:32px 20px;font-size:14px;color:var(--mut);text-align:center}
.btnSec{width:100%;height:52px;border:1px solid var(--chip);border-radius:16px;background:var(--card);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btnSec svg{width:18px;height:18px}
.btnPri{width:100%;height:56px;border:0;border-radius:16px;background:var(--amarillo);color:var(--bg);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.btnPri:disabled{background:#24284A;color:var(--mut)}
.btnPri svg{width:20px;height:20px}
.btnPeligro{width:100%;height:52px;border:1px solid #6B3340;border-radius:16px;background:transparent;color:var(--rojo);font-size:15px;font-weight:800}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(var(--bot) + 24px);width:62px;height:62px;border-radius:31px;border:0;background:var(--amarillo);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:5}
.fab svg{width:26px;height:26px}
/* Nuevo movimiento */
.seg{display:grid;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{height:50px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;color:var(--mut)}
.seg button.ret{background:var(--rojoBg);color:var(--rojo)}
.seg button.abo{background:var(--verdeBg);color:var(--verde)}
.seg button.on{background:#34386B;color:var(--ink)}
.dests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dest{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;padding:0 4px}
.dest.on{border-color:var(--amarillo);background:var(--sel)}
.req{font-size:12.5px;font-weight:700;color:var(--rojo)}
.candado{height:44px;margin:-14px -8px -14px 0;padding:0 8px;border:0;background:transparent;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--mut)}
.candado.on{color:var(--amarillo)}
.candado svg{width:14px;height:14px}
.monto{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.monto .row{display:flex;align-items:baseline;gap:8px;font-size:36px;font-weight:800;letter-spacing:-.03em}
.monto input{flex:1 1 0;min-width:0;border:0;outline:0;padding:0;background:transparent;font-size:36px;font-weight:800;letter-spacing:-.03em;height:48px}
.monto input::placeholder{color:#4A4F7E}
.prev{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px dashed var(--chip);border-radius:16px}
.prev .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.err{margin:0;font-size:13.5px;font-weight:700;color:var(--rojo)}
.ok{margin:0;font-size:13.5px;font-weight:700;color:var(--verde)}
/* Registros */
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:16px}
.resumen div{display:flex;flex-direction:column;gap:3px;padding:12px 14px;min-width:0}
.resumen div+div{border-left:1px solid var(--line)}
.resumen .v{font-size:17px;font-weight:800}
.diaH{margin:0;padding:14px 20px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mut);border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg)}
.hoja{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 0 calc(var(--bot) + 18px);display:flex;flex-direction:column;gap:12px}
.asa{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--chip)}
.carr{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 36px;scrollbar-width:none}
.carr::-webkit-scrollbar{display:none}
.pag{flex:0 0 100%;scroll-snap-align:center}
.presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.presets button{height:48px;border:0;border-radius:12px;padding:0;background:transparent;color:var(--mut2);font-size:13px;font-weight:800;white-space:nowrap}
.presets button.on{background:var(--amarillo);color:var(--bg)}
.rango{display:flex;align-items:center;gap:8px}
.fch{position:relative;flex:1 1 0;min-width:0;height:56px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 14px}
.fch.on{border-color:var(--amarillo)}
.fch b{font-size:15px;font-weight:800;white-space:nowrap}
.fch input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;-webkit-appearance:none;appearance:none}
.puntos{display:flex;justify-content:center;gap:8px}
.puntos span{width:8px;height:8px;border-radius:4px;background:var(--chip)}
.puntos span.on{background:var(--ink)}
.btnPdf{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--chip);background:var(--card);font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.btnPdf svg{width:18px;height:18px}
/* Encargada */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#C9C2FF;background:var(--sel);border-radius:999px;padding:5px 10px}
.badge svg{width:14px;height:14px}
.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sel);border-radius:14px;padding:6px 6px 6px 14px;font-size:13px;color:var(--moradoTx);font-weight:600}
.aviso button{height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--amarillo);color:var(--bg);font-size:13px;font-weight:800}
.lnk{height:44px;padding:0 4px;border:0;background:transparent;color:var(--mut2);font-size:14px;font-weight:700}
/* Ajustes */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column}
.card .h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 8px 0 14px}
.card .h b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.campo{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-top:1px solid var(--line2)}
.campo span{font-size:13.5px;font-weight:600;color:var(--mut);width:96px;flex-shrink:0}
.campo input{flex:1 1 0;min-width:0;height:46px;border:0;outline:0;padding:0;background:transparent;font-size:15px;font-weight:700;text-align:right}
.campo input::placeholder{color:#6A6F99;font-weight:600}
.card .pie{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line2)}
.sw{height:44px;padding:0 6px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:8px}
.sw i{width:46px;height:28px;border-radius:14px;background:var(--chip);display:flex;align-items:center;padding:3px;transition:background .15s}
.sw i::after{content:"";width:22px;height:22px;border-radius:11px;background:var(--ink);transition:transform .15s}
.sw.on i{background:var(--amarillo)}
.sw.on i::after{background:var(--bg);transform:translateX(18px)}
.btnMini{height:44px;border:0;border-radius:12px;background:var(--amarillo);color:var(--bg);font-size:14.5px;font-weight:800}
.btnMini:disabled{opacity:.6}
.linkBox{font-size:13.5px;font-weight:700;color:var(--mut2);word-break:break-all;padding:12px 14px}
.signo{display:grid;grid-template-columns:repeat(2,44px);gap:2px;padding:2px;background:var(--bg);border-radius:12px}
.signo button{height:40px;border:0;border-radius:10px;background:transparent;font-size:18px;font-weight:800;color:var(--mut)}
.signo button.on{background:#34386B;color:var(--ink)}
/* Hoja de detalle */
.velo{position:fixed;inset:0;background:rgba(5,6,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.det{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 20px calc(var(--bot) + 22px);display:flex;flex-direction:column;gap:14px}
.det dl{margin:0;display:grid;grid-template-columns:auto 1fr;row-gap:10px;column-gap:16px;font-size:14.5px}
.det dt{color:var(--mut);font-weight:600}
.det dd{margin:0;text-align:right;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 100px);background:var(--ink);color:var(--bg);font-size:14px;font-weight:800;padding:12px 18px;border-radius:14px;z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.4);max-width:88%;text-align:center}
.centro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.logo{width:56px;height:56px;border-radius:18px;background:var(--morado);color:#fff;display:flex;align-items:center;justify-content:center}
.logo svg{width:28px;height:28px}
.inp{height:54px;border:1px solid var(--line);border-radius:14px;outline:0;padding:0 14px;background:var(--card);font-size:16px;font-weight:700;width:100%}
.inp:focus{border-color:var(--amarillo)}
.lbl{display:flex;flex-direction:column;gap:6px}
.col{display:flex;flex-direction:column}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}
</style>
</head>
<body>
<main id="app"><div class="centro"><span class="mut">Cargando…</span></div></main>
<div id="capa"></div>
<script>
// ===== Cajas Rurales =====
// Cambiar VERSION cada vez que se publique: los teléfonos se actualizan solos.
const VERSION='2026-11-12.3';
// Mismo proyecto de Supabase que Cobros (tablas aparte, cr_*). La clave pública no es secreta:
// lo que protege los datos son las reglas de supabase/cajas_rurales.sql.
const SB_URL='https://shlolncjhfzqmcllwjrk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNobG9sbmNqaGZ6cW1jbGx3anJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzU5NjQsImV4cCI6MjA5NzYxMTk2NH0.CnXj2cX5V_XDy902rFN88PU_rMPEb5qdqHmAiyFXpvk';
const DOMINIO='cobros.local';
const ADMIN='cesar';
const K_TOKEN='cr_token_encargada';
const PDF_LIB='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

// César: la sesión queda guardada en este teléfono y pide la contraseña otra vez cada 30 días.
const K_ADMIN_DESDE='cr_admin_desde';
const DIAS_SESION=30;
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'cr-sesion-admin',persistSession:true,autoRefreshToken:true}});

const N={bam:'Tarjeta BAM',ss:'Caja Santa Sofía',sr:'Caja San Rafael'};
const NC={bam:'Tarjeta',ss:'Santa Sofía',sr:'San Rafael'};
const PUNTO={ss:'#B79CFF',sr:'#FF8FB1'};
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PRESETS=[['7d','7 días'],['30d','30 días'],['12s','12 sem.'],['6m','6 meses'],['1a','1 año']];

const I={
  flecha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  atras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  sig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  ojo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',

  candA:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg>',
  candC:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  basura:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  banco:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4H4l8-4ZM6 11v6M10 11v6M14 11v6M18 11v6M4 20h16"/></svg>'
};

// ===== Estado =====
const S={
  modo:null,            // 'admin' | 'enc'
  pantalla:'cargando',
  cuentas:null,         // {bam:{inicial,configurada},...} en centavos
  movs:[],              // [{id,ts,creado,tipo,cuenta,monto,afecta}] en centavos, sin anulados
  orden:[],             // movs del más nuevo al más viejo
  saldo:{bam:0,ss:0,sr:0},
  sal:{},               // id -> {bam, caja}: saldo después de cada movimiento
  filtro:'todo',
  reg:null, nuevo:null, det:null,
  accesos:null, accMsg:{},
  enc:null, encVer:30, prevCaja:'ss',
  loginErr:'', primeraVez:false, error:''
};

// ===== Utilidades =====
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aCent=x=>Math.round(Number(x)*100);
const fmt=c=>(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sal=c=>(c<0?'−':'')+fmt(c);
const salQ=c=>(c<0?'−':'')+'Q '+fmt(c);
const dos=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+dos(d.getMonth()+1)+'-'+dos(d.getDate());
const hoyIso=()=>iso(new Date());
const isoAFecha=s=>{const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const isoTxt=s=>{const d=isoAFecha(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' '+d.getFullYear();};
const horaDe=ts=>{const d=new Date(ts);return dos(d.getHours())+':'+dos(d.getMinutes());};
const diaCorto=ts=>{const d=new Date(ts),h=new Date();return DIAS_C[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+(d.getFullYear()!==h.getFullYear()?' '+d.getFullYear():'');};
const fechaLarga=()=>{const d=new Date();return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];};
function rangoDe(k){
  const h=new Date(),d=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  if(k==='7d')d.setDate(d.getDate()-6);
  if(k==='30d')d.setDate(d.getDate()-29);
  if(k==='12s')d.setDate(d.getDate()-83);
  if(k==='6m'){d.setMonth(d.getMonth()-6);d.setDate(d.getDate()+1);}
  if(k==='1a'){d.setFullYear(d.getFullYear()-1);d.setDate(d.getDate()+1);}
  return iso(d);
}
// Tamaño de letra según el largo, para que siempre quepa
const fsGrande=t=>t.length<=13?'min(38px,9.6vw)':t.length<=15?'min(32px,8.2vw)':'min(27px,7vw)';
const fsCaja=t=>t.length<=11?'min(20px,5.3vw)':t.length<=13?'min(17px,4.5vw)':'min(15px,4vw)';
// Texto de monto mientras se escribe: solo números, un punto, 2 decimales, comas de miles
function formatoMonto(v){
  v=String(v).replace(/[^0-9.]/g,'');
  const i=v.indexOf('.');
  let ent=i>=0?v.slice(0,i):v;
  const dec=i>=0?v.slice(i+1).replace(/\./g,'').slice(0,2):null;
  ent=ent.replace(/^0+(?=\d)/,'').slice(0,10).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dec!==null?(ent===''?'0':ent)+'.'+dec:ent;
}
const montoACent=t=>{const n=parseFloat(String(t).replace(/,/g,''));return isFinite(n)?Math.round(n*100):0;};

// ===== Cuentas =====
// Cuánto mueve un movimiento a una cuenta (en centavos)
function delta(m,cta){
  const sg=m.tipo==='retiro'?-1:1;
  if(cta==='bam')return (m.cuenta==='bam'||m.afecta)?sg*m.monto:0;
  return m.cuenta===cta?sg*m.monto:0;
}
function calcular(){
  const asc=S.movs.slice().sort((a,b)=>a.ts-b.ts||a.creado-b.creado);
  const run={bam:S.cuentas.bam.inicial,ss:S.cuentas.ss.inicial,sr:S.cuentas.sr.inicial};
  S.sal={};
  asc.forEach(m=>{
    ['bam','ss','sr'].forEach(c=>{run[c]+=delta(m,c);});
    S.sal[m.id]={bam:run.bam,caja:m.cuenta!=='bam'?run[m.cuenta]:null};
  });
  S.saldo=run;
  S.orden=asc.reverse();
}
const coincide=(m,f)=>f==='todo'?true:f==='bam'?(m.cuenta==='bam'||m.afecta):m.cuenta===f;
const tituloDe=m=>m.tipo==='retiro'?(m.cuenta!=='bam'&&!m.afecta?'Retiro · solo caja':'Retiro'):'Abono';
function fila(m,f,conFecha){
  const r=m.tipo==='retiro',enCaja=m.cuenta!=='bam',x=S.sal[m.id];
  let saldo;
  if(f==='bam')saldo='Saldo '+sal(x.bam);
  else if(f==='todo')saldo=enCaja?'Caja '+sal(x.caja):'Tarjeta '+sal(x.bam);
  else saldo='Saldo '+sal(x.caja);
  return {id:m.id,r:r,titulo:tituloDe(m),sub:NC[m.cuenta]+' · '+(conFecha?diaCorto(m.ts)+' ':'')+horaDe(m.ts),monto:(r?'−':'+')+fmt(m.monto),saldo:saldo};
}
function filaHTML(f,tap){
  const tag=tap?'button':'div';
  const fila=`<${tag} class="mov"${tap?` data-a="det" data-v="${esc(f.id)}"`:''}>
<span class="ic ${f.r?'r':'a'}">${I.flecha}</span>
<span class="mt"><span class="t">${esc(f.titulo)}</span><span class="s">${esc(f.sub)}</span></span>
<span class="mm"><span class="m ${f.r?'r':'a'} num">${f.monto}</span><span class="s num">${esc(f.saldo)}</span></span>
</${tag}>`;
  if(!tap)return fila;
  return `<div class="desliza"><button class="borrar" data-a="borrarRapido" data-v="${esc(f.id)}" tabindex="-1">${I.basura}Eliminar</button>${fila}</div>`;
}

// ===== Datos (César) =====
async function cargarAdmin(){
  const c=await sb.from('cr_cuentas').select('id,saldo_inicial,configurada');
  if(c.error)throw c.error;
  const cu={};(c.data||[]).forEach(r=>{cu[r.id]={inicial:aCent(r.saldo_inicial),configurada:!!r.configurada};});
  if(!cu.bam||!cu.ss||!cu.sr)throw new Error('La base de datos de Cajas Rurales no está lista.');
  let todos=[],desde=0;const P=1000;
  for(;;){
    const r=await sb.from('cr_movimientos').select('id,fecha,tipo,cuenta,monto,afecta_tarjeta,creado_en')
      .eq('anulado',false).order('fecha',{ascending:true}).order('creado_en',{ascending:true}).range(desde,desde+P-1);
    if(r.error)throw r.error;
    todos=todos.concat(r.data||[]);
    if(!r.data||r.data.length<P)break;
    desde+=P;
  }
  S.cuentas=cu;
  S.movs=todos.map(r=>({id:r.id,ts:Date.parse(r.fecha),creado:Date.parse(r.creado_en),tipo:r.tipo,cuenta:r.cuenta,monto:aCent(r.monto),afecta:!!r.afecta_tarjeta}));
  calcular();
}
async function entrarAdmin(user){
  const email=String((user&&user.email)||'').toLowerCase();
  if(email!==ADMIN+'@'+DOMINIO){
    try{await sb.auth.signOut();}catch(e){}
    S.modo=null;S.pantalla='login';S.loginErr='Este usuario no tiene acceso a Cajas Rurales.';render();return;
  }
  const a=await sb.rpc('cr_es_admin');
  if(a.error||a.data!==true){
    S.pantalla='problema';S.error=a.error?'No se pudo conectar. Revisa tu internet.':'Tu usuario todavía no está activado en Cajas Rurales.';render();return;
  }
  S.modo='admin';
  try{await cargarAdmin();}
  catch(e){S.pantalla='problema';S.error=mensajeError(e);render();return;}
  const sinConfig=['bam','ss','sr'].some(k=>!S.cuentas[k].configurada);
  if(sinConfig&&!S.movs.length){S.primeraVez=true;irSaldos();return;}
  S.pantalla='panel';render();
}
function mensajeError(e){
  const m=String((e&&e.message)||e||'');
  if(/fetch|network|Failed|conex/i.test(m))return 'No se pudo conectar. Revisa tu internet.';
  if(/cr_|relation|does not exist|schema cache/i.test(m))return 'La base de datos de Cajas Rurales no está lista.';
  return m||'Algo salió mal.';
}
async function recargar(){
  try{await cargarAdmin();return true;}catch(e){toast(mensajeError(e));return false;}
}

// ===== Datos (encargada) =====
async function cargarEnc(tok){
  let r;
  try{r=await sb.rpc('cr_datos',{p_token:tok});}catch(e){r={error:e};}
  if(r.error)return 'red';
  const d=r.data||{};
  if(!d.ok){try{localStorage.removeItem(K_TOKEN);}catch(e){}return false;}
  S.enc={caja:d.caja,cuenta:d.cuenta,nombre:d.nombre||'',saldo:aCent(d.saldo),
    movs:(d.movimientos||[]).map(m=>({ts:Date.parse(m.fecha),tipo:m.tipo,monto:aCent(m.monto),saldo:aCent(m.saldo)}))};
  return true;
}
function tokenGuardado(){try{return localStorage.getItem(K_TOKEN);}catch(e){return null;}}

// ===== Arranque =====
async function iniciar(){
  revisarVersion();
  const tok=tokenGuardado();
  if(tok){
    const r=await cargarEnc(tok);
    if(r===true){S.modo='enc';S.pantalla='enc';render();return;}
    if(r==='red'){S.modo='enc';S.pantalla='problema';S.error='No se pudo conectar. Revisa tu internet.';render();return;}
    S.loginErr='Tu sesión terminó. Vuelve a entrar.';
  }
  let ses=null;
  try{const g=await sb.auth.getSession();ses=g.data&&g.data.session;}catch(e){}
  if(ses){
    let desde=0;try{desde=+localStorage.getItem(K_ADMIN_DESDE)||0;}catch(e){}
    if(!desde){desde=Date.now();try{localStorage.setItem(K_ADMIN_DESDE,String(desde));}catch(e){}}
    if(Date.now()-desde>DIAS_SESION*86400000){
      try{await sb.auth.signOut();}catch(e){}
      try{localStorage.removeItem(K_ADMIN_DESDE);}catch(e){}
      S.loginErr='Por seguridad, vuelve a escribir tu contraseña (cada 30 días).';S.pantalla='login';render();return;
    }
    await entrarAdmin(ses.user);return;
  }
  S.pantalla='login';render();
}
async function entrar(){
  const u=String(document.getElementById('lgU').value||'').trim().toLowerCase();
  const p=String(document.getElementById('lgP').value||'');
  const err=document.getElementById('lgErr'),btn=document.getElementById('lgBtn');
  if(!u){err.textContent='Escribe tu usuario.';return;}
  if(!p){err.textContent='Escribe tu contraseña.';return;}
  btn.disabled=true;btn.textContent='Entrando…';err.textContent='';
  const fin=m=>{btn.disabled=false;btn.textContent='Entrar';err.textContent=m;};
  if(u===ADMIN){
    let res;
    try{res=await sb.auth.signInWithPassword({email:u+'@'+DOMINIO,password:p});}catch(e){res={error:e};}
    if(res.error||!res.data||!res.data.session){
      const m=String((res.error&&res.error.message)||'');
      fin(/fetch|network|Failed/i.test(m)?'No se pudo conectar. Revisa tu internet.':'Usuario o contraseña incorrectos.');return;
    }
    try{localStorage.setItem(K_ADMIN_DESDE,String(Date.now()));}catch(e){}
    S.loginErr='';await entrarAdmin(res.data.user);return;
  }
  let r;
  try{r=await sb.rpc('cr_login',{p_usuario:u,p_clave:p});}catch(e){r={error:e};}
  if(r.error){fin('No se pudo conectar. Revisa tu internet.');return;}
  if(!r.data||!r.data.ok){fin((r.data&&r.data.error)||'Usuario o contraseña incorrectos.');return;}
  try{localStorage.setItem(K_TOKEN,r.data.token);}catch(e){}
  const c=await cargarEnc(r.data.token);
  if(c!==true){fin('No se pudo cargar tu caja. Intenta otra vez.');return;}
  S.loginErr='';S.modo='enc';S.encVer=30;S.pantalla='enc';render();
}
async function salirEnc(){
  const tok=tokenGuardado();
  try{if(tok)await sb.rpc('cr_salir',{p_token:tok});}catch(e){}
  try{localStorage.removeItem(K_TOKEN);}catch(e){}
  S.enc=null;S.modo=null;S.pantalla='login';render();
}
async function salirAdmin(){
  try{await sb.auth.signOut();}catch(e){}
  try{localStorage.removeItem(K_ADMIN_DESDE);}catch(e){}
  location.reload();
}

<button class="btnPdf" data-a="pdf" id="btnPdf">${I.pdf}PDF</button></header>
<nav class="chips" aria-label="Cuenta">${chip('todo','Todos')}${chip('bam','Tarjeta')}${chip('ss','Santa Sofía')}${chip('sr','San Rafael')}</nav>
<div class="resumen"><div><span class="cap" style="font-size:11.5px">Retiros</span><span class="v rojo num">${d.ret?'−':''}${fmt(d.ret)}</span></div><div><span class="cap" style="font-size:11.5px">Abonos</span><span class="v verde num">${d.abo?'+':''}${fmt(d.abo)}</span></div></div>
<span class="s" style="font-size:13px">${d.lista.length} ${d.lista.length===1?'movimiento':'movimientos'} · ${isoTxt(g.desde)} – ${hastaTxt}</span>
</div>
<div class="lista scroll" style="flex:1 1 0;min-height:0">${html||`<p class="vacio">Sin movimientos en este periodo.</p>`}</div>
<div class="hoja"><span class="asa" aria-hidden="true"></span>
<div class="carr" id="carr">
<div class="pag"><div class="presets">${PRESETS.map(p=>`<button class="${g.modo==='preset'&&g.preset===p[0]?'on':''}" data-a="regPreset" data-v="${p[0]}">${p[1]}</button>`).join('')}</div></div>
<div class="pag"><div class="rango">
<label class="fch${g.modo==='rango'?' on':''}"><span class="cap" style="font-size:11px">Desde</span><b>${isoTxt(g.desde)}</b><input type="date" id="rgDesde" aria-label="Desde" value="${g.desde}" max="${g.hasta}"></label>
<span class="mut" aria-hidden="true" style="font-weight:800">–</span>
<label class="fch${g.modo==='rango'?' on':''}"><span class="cap" style="font-size:11px">Hasta</span><b>${hastaTxt}</b><input type="date" id="rgHasta" aria-label="Hasta" value="${g.hasta}" min="${g.desde}" max="${hoy}"></label>
</div></div></div>
<div class="puntos" aria-hidden="true"><span id="pt0" class="${g.pag===0?'on':''}"></span><span id="pt1" class="${g.pag===1?'on':''}"></span></div>
</div></section>`;
};

function encHTML(e,preview){
  const filas=e.movs.slice(0,S.encVer).map(m=>{
    const r=m.tipo==='retiro';
    return filaHTML({r:r,titulo:r?'Retiro':'Abono',sub:diaCorto(m.ts)+' '+horaDe(m.ts),monto:(r?'−':'+')+fmt(m.monto),saldo:'Saldo '+sal(m.saldo)},false);
  }).join('');
  const t=salQ(e.saldo);
  return `<section class="scr scroll" style="padding:calc(var(--top) + 18px) 0 calc(var(--bot) + 24px)">
<div class="col g14" style="padding:0 20px 14px">
${preview?`<div class="aviso"><span>Vista previa de encargada</span><button data-a="ir" data-v="panel">Salir</button></div>
<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="${S.prevCaja==='ss'?'on':''}" data-a="prevCaja" data-v="ss">Santa Sofía</button><button class="${S.prevCaja==='sr'?'on':''}" data-a="prevCaja" data-v="sr">San Rafael</button></div>`:''}
<header class="top" style="align-items:flex-start"><div class="col g8" style="align-items:flex-start"><span class="badge">${I.candC}Solo consulta</span>
<div class="col" style="gap:2px"><h1 style="font-size:26px">${esc(e.cuenta)}</h1>${e.nombre?`<span class="s" style="font-size:13.5px">${esc(e.nombre)}</span>`:''}</div></div>
${preview?'':`<button class="lnk" data-a="salirEnc">Salir</button>`}</header>
<div class="tarjeta" style="cursor:default"><span class="lbl">Saldo actual</span><span class="big num" style="font-size:${fsGrande(t)}">${t}</span></div>
<div class="secH"><h2>Movimientos</h2></div>
</div>
<div class="lista">${filas||`<p class="vacio">Sin movimientos registrados.</p>`}</div>
${e.movs.length>S.encVer?`<div style="padding:14px 16px 0"><button class="btnSec" data-a="encMas">Mostrar más${I.sig}</button></div>`:''}
</section>`;
}
V.enc=()=>encHTML(S.enc,false);
V.prev=()=>{
  const k=S.prevCaja;
  const movs=S.orden.filter(m=>m.cuenta===k).map(m=>({ts:m.ts,tipo:m.tipo,monto:m.monto,saldo:S.sal[m.id].caja}));
  const nombre=S.accesos&&S.accesos[k]?S.accesos[k].nombre:'';
  return encHTML({caja:k,cuenta:N[k],nombre:nombre,saldo:S.saldo[k],movs:movs},true);
};

V.ajustes=()=>{
  const link=location.origin+location.pathname.replace(/index\.html$/,'');
  let acc;
  if(S.accesos===null)acc=`<p class="mut" style="margin:0">Cargando accesos…</p>`;
  else if(S.accesos===false)acc=`<p class="err">No se pudieron cargar los accesos. Revisa tu internet.</p>`;
  else acc=['ss','sr'].map(k=>{
    const a=S.accesos[k],m=S.accMsg[k]||{};
    return `<div class="card">
<div class="h"><b><span class="punto" style="background:${PUNTO[k]}"></span>${N[k]}</b>
<button class="sw${a.activo?' on':''}" role="switch" aria-checked="${a.activo}" data-a="accActivo" data-v="${k}">${a.activo?'Activo':'Desactivado'}<i></i></button></div>
<label class="campo"><span>Encargada</span><input data-acc="${k}" data-c="nombre" value="${esc(a.nombre)}" placeholder="Nombre"></label>
<label class="campo"><span>Usuario</span><input data-acc="${k}" data-c="usuario" value="${esc(a.usuario)}" placeholder="Usuario" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
<label class="campo"><span>Contraseña</span><input data-acc="${k}" data-c="clave" value="${esc(a.clave)}" placeholder="${a.tiene?'Sin cambio':'Sin definir'}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>
<div class="pie">${m.txt?`<p class="${m.ok?'ok':'err'}" role="status">${esc(m.txt)}</p>`:''}<button class="btnMini" data-a="accGuardar" data-v="${k}"${m.guardando?' disabled':''}>${m.guardando?'Guardando…':'Guardar'}</button></div>
</div>`;
  }).join('');
  return `<section class="scr scroll pad"><div class="col g16">
<header class="topL"><button class="ib" data-a="ir" data-v="panel" aria-label="Volver">${I.atras}</button><h1 class="m">Ajustes</h1></header>
<span class="cap">Accesos de encargadas</span>
${acc}
<span class="s" style="font-size:13px;line-height:1.45">Cada encargada ve solo su caja, sin poder cambiar nada. Su sesión dura 30 días. Si cambias la contraseña o desactivas el acceso, se cierra en su teléfono.</span>
<span class="cap" style="margin-top:6px">Link para las encargadas</span>
<div class="card"><span class="linkBox">${esc(link)}</span><div class="pie" style="flex-direction:row"><button class="btnMini" style="flex:1;background:var(--card);color:var(--ink);border:1px solid var(--chip)" data-a="copiarLink">Copiar</button><button class="btnMini" style="flex:1" data-a="compartirLink">Compartir</button></div></div>
<span class="cap" style="margin-top:6px">Cuentas</span>
<button class="btnSec" data-a="saldos">Saldos iniciales${I.sig}</button>
<button class="btnPeligro" style="margin-top:6px" data-a="salirAdmin">Cerrar sesión</button>
<span class="s" style="text-align:center;font-size:12px">Versión ${VERSION}</span>
</div></section>`;
};

V.saldos=()=>{
  const v=S.saldosEd;
  const fila=k=>`<div class="card"><div class="h"><b>${k==='bam'?'':`<span class="punto" style="background:${PUNTO[k]}"></span>`}${N[k]}</b>
<div class="signo" role="group" aria-label="Signo"><button class="${v[k].neg?'on':''}" data-a="sgn" data-v="${k}-1" aria-label="Negativo">−</button><button class="${v[k].neg?'':'on'}" data-a="sgn" data-v="${k}+1" aria-label="Positivo">+</button></div></div>
<label class="campo"><span>Saldo</span><input data-sal="${k}" inputmode="decimal" placeholder="0.00" value="${esc(v[k].txt)}" autocomplete="off"></label></div>`;
  return `<section class="scr scroll pad"><div class="col g16">
<header class="topL">${S.primeraVez?'':`<button class="ib" data-a="ir" data-v="ajustes" aria-label="Volver">${I.atras}</button>`}<h1 class="m">Saldos iniciales</h1></header>
<span class="s" style="font-size:14px;line-height:1.45">${S.primeraVez?'Bienvenido. Escribe el saldo que tiene hoy cada cuenta. A partir de aquí la app suma y resta cada movimiento.':'El saldo de cada cuenta es: saldo inicial + movimientos.'}</span>
${!S.primeraVez&&S.movs.length?`<p class="err" style="font-weight:600;line-height:1.45">Ya hay movimientos registrados: si cambias un saldo inicial, cambian todos los saldos de esa cuenta.</p>`:''}
${fila('bam')}${fila('ss')}${fila('sr')}
<p class="err" id="slErr" role="alert"></p>
<button class="btnPri" data-a="saldosGuardar" id="slBtn">Guardar saldos</button>
</div></section>`;
};

function detHTML(){
  const m=S.movs.find(x=>x.id===S.det.id);if(!m)return '';
  const r=m.tipo==='retiro',x=S.sal[m.id],d=new Date(m.ts);
  const filas=[['Cuenta',N[m.cuenta]],['Fecha',DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear()],['Hora',horaDe(m.ts)]];
  if(m.cuenta!=='bam'&&r)filas.push(['Afectó la tarjeta',m.afecta?'Sí':'No']);
  if(m.cuenta!=='bam')filas.push(['Saldo de la caja después',sal(x.caja)]);
  if(m.cuenta==='bam'||m.afecta)filas.push(['Saldo de la tarjeta después',sal(x.bam)]);
  return `<div class="velo" data-a="detCerrar"><div class="det" role="dialog" aria-label="Detalle del movimiento" data-stop="1">
<span class="asa" aria-hidden="true"></span>
<div class="secH" style="align-items:center"><h2 style="font-size:18px;margin:0">${esc(tituloDe(m))}</h2><span class="${r?'rojo':'verde'} num" style="font-size:20px;font-weight:800">${r?'−':'+'}Q ${fmt(m.monto)}</span></div>
<dl>${filas.map(f=>`<dt>${esc(f[0])}</dt><dd class="num">${esc(f[1])}</dd>`).join('')}</dl>
${S.det.confirmar?`<p style="margin:0;font-size:14px;font-weight:700;line-height:1.45">¿Eliminar este movimiento? Deja de contar y los saldos se recalculan. No se puede deshacer.</p>
<div class="fila2"><button class="btnSec" data-a="detNo">Cancelar</button><button class="btnPri" style="background:var(--rojo)" data-a="detAnular"${S.det.anulando?' disabled':''}>${S.det.anulando?'Eliminando…':'Sí, eliminar'}</button></div>`
:`<button class="btnPeligro" data-a="detConfirmar">Eliminar movimiento</button>`}
</div></div>`;
}

// ===== Dibujar =====
function render(){
  const app=document.getElementById('app');
  app.innerHTML=(V[S.pantalla]||V.cargando)();
  document.getElementById('capa').innerHTML=S.det?detHTML():'';
  despues();
}
function despues(){
  if(S.pantalla==='login'){
    const f=document.getElementById('lgForm');
    f.addEventListener('submit',e=>{e.preventDefault();entrar();});
  }
  if(S.pantalla==='nuevo'){
    const i=document.getElementById('nvMonto');
    i.addEventListener('input',()=>{
      const v=formatoMonto(i.value);i.value=v;S.nuevo.monto=v;S.nuevo.err='';
      document.getElementById('nvPrev').innerHTML=prevHTML();
      document.getElementById('nvGuardar').disabled=!calcNuevo().listo;
      document.getElementById('nvErr').textContent='';
    });
  }
  if(S.pantalla==='reg'){
    const c=document.getElementById('carr');
    if(S.reg.pag===1)c.scrollLeft=c.scrollWidth;
    c.addEventListener('scroll',()=>{
      const p=c.scrollLeft>(c.scrollWidth-c.clientWidth)/2?1:0;
      if(p!==S.reg.pag){S.reg.pag=p;document.getElementById('pt0').className=p===0?'on':'';document.getElementById('pt1').className=p===1?'on':'';}
    },{passive:true});
    const cambio=(cual)=>e=>{
      const v=String(e.target.value||'');if(!v)return;
      const g=S.reg,hoy=hoyIso();
      if(cual==='desde'){g.desde=v>hoy?hoy:v;if(g.desde>g.hasta)g.hasta=g.desde;}
      else{g.hasta=v>hoy?hoy:v;if(g.hasta<g.desde)g.desde=g.hasta;}
      g.modo='rango';g.pag=1;render();
    };
    document.getElementById('rgDesde').addEventListener('change',cambio('desde'));
    document.getElementById('rgHasta').addEventListener('change',cambio('hasta'));
  }
  if(S.pantalla==='ajustes'){
    document.querySelectorAll('[data-acc]').forEach(inp=>inp.addEventListener('input',()=>{
      const a=S.accesos[inp.dataset.acc];
      a[inp.dataset.c]=inp.dataset.c==='usuario'?inp.value.replace(/\s/g,'').toLowerCase():inp.value;
      if(inp.dataset.c==='usuario'&&inp.value!==a.usuario)inp.value=a.usuario;
    }));
  }
  if(S.pantalla==='saldos'){
    document.querySelectorAll('[data-sal]').forEach(inp=>inp.addEventListener('input',()=>{
      const v=formatoMonto(inp.value);inp.value=v;S.saldosEd[inp.dataset.sal].txt=v;
    }));
  }
}
let _toastT=null;
function toast(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}
  el.textContent=t;el.style.display='block';
  clearTimeout(_toastT);_toastT=setTimeout(()=>{el.style.display='none';},2600);
}

// ===== Deslizar a la izquierda para eliminar =====
const ANCHO_BORRAR=96;
let _dz=null,_dzAbierto=null,_dzRecien=0;
function cerrarDeslizes(excepto){
  document.querySelectorAll('.desliza').forEach(d=>{if(d!==excepto){const m=d.querySelector('.mov');if(m)m.style.transform='';d.classList.remove('abierto');}});
  if(!excepto)_dzAbierto=null;
}
document.addEventListener('pointerdown',e=>{
  const d=e.target.closest('.desliza');
  if(!d||e.target.closest('.borrar')){if(_dzAbierto&&!e.target.closest('.borrar')){cerrarDeslizes();_dzRecien=Date.now();}return;}
  if(_dzAbierto&&_dzAbierto!==d){cerrarDeslizes();_dzRecien=Date.now();return;}
  _dz={d:d,m:d.querySelector('.mov'),x:e.clientX,y:e.clientY,base:d.classList.contains('abierto')?-ANCHO_BORRAR:0,dx:0,horiz:null};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!_dz)return;
  const dx=e.clientX-_dz.x,dy=e.clientY-_dz.y;
  if(_dz.horiz===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;_dz.horiz=Math.abs(dx)>Math.abs(dy);if(_dz.horiz)_dz.d.classList.add('mueve');}
  if(!_dz.horiz)return;
  _dz.dx=dx;
  const x=Math.max(-ANCHO_BORRAR-24,Math.min(0,_dz.base+dx));
  _dz.m.style.transform='translateX('+x+'px)';
},{passive:true});
function soltarDesliz(){
  if(!_dz)return;
  const z=_dz;_dz=null;
  z.d.classList.remove('mueve');
  if(!z.horiz)return;
  _dzRecien=Date.now();
  const fin=z.base+z.dx;
  if(fin<-ANCHO_BORRAR/2){z.m.style.transform='translateX(-'+ANCHO_BORRAR+'px)';z.d.classList.add('abierto');_dzAbierto=z.d;}
  else{z.m.style.transform='';z.d.classList.remove('abierto');if(_dzAbierto===z.d)_dzAbierto=null;}
}
document.addEventListener('pointerup',soltarDesliz,{passive:true});
document.addEventListener('pointercancel',soltarDesliz,{passive:true});

// ===== Acciones =====
const A={
  ir:v=>ir(v),
  reintentar:()=>{S.pantalla='cargando';render();iniciar();},
  salirEnc:()=>salirEnc(),
  salirAdmin:()=>salirAdmin(),
  filtro:v=>{S.filtro=v;render();},
  filtroT:v=>{S.filtro=S.filtro===v?'todo':v;render();},
  nuevo:()=>abrirNuevo(),
  nvTipo:v=>{S.nuevo.tipo=v;render();},
  nvDest:v=>{S.nuevo.dest=v;render();},
  nvCandado:()=>{S.nuevo.afecta=!S.nuevo.afecta;render();},
  nvGuardar:()=>guardarMov(),
  regCuenta:v=>{S.reg.cuenta=v;render();},
  regPreset:v=>{const g=S.reg;g.modo='preset';g.preset=v;g.desde=rangoDe(v);g.hasta=hoyIso();g.pag=0;render();},
  pdf:()=>hacerPdf(),
  det:v=>{S.det={id:v,confirmar:false};render();},
  detCerrar:()=>{if(S.det&&S.det.anulando)return;S.det=null;render();},
  detConfirmar:()=>{S.det.confirmar=true;render();},
  borrarRapido:v=>{cerrarDeslizes();S.det={id:v,confirmar:true};render();},
  detNo:()=>{S.det.confirmar=false;render();},
  detAnular:()=>anularMov(),
  encMas:()=>{S.encVer+=30;render();},
  prevCaja:v=>{S.prevCaja=v;render();},
  accActivo:v=>{const a=S.accesos[v];a.activo=!a.activo;render();},
  accGuardar:v=>guardarAcceso(v),
  copiarLink:async()=>{const l=location.origin+location.pathname.replace(/index\.html$/,'');try{await navigator.clipboard.writeText(l);toast('Link copiado');}catch(e){toast('No se pudo copiar');}},
  compartirLink:async()=>{const l=location.origin+location.pathname.replace(/index\.html$/,'');
    if(navigator.share){try{await navigator.share({title:'Cajas Rurales',url:l});}catch(e){}}else A.copiarLink();},
  saldos:()=>irSaldos(),
  sgn:v=>{S.saldosEd[v.slice(0,-2)].neg=v.slice(-2)==='-1';render();},
  saldosGuardar:()=>guardarSaldos()
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  // Un toque justo después de deslizar (o para cerrar un renglón abierto) no abre el detalle
  if(t.dataset.a==='det'&&Date.now()-_dzRecien<200){e.preventDefault();return;}
  if(t.dataset.a==='det'&&t.closest('.desliza.abierto')){e.preventDefault();cerrarDeslizes();return;}
  // Toques dentro de la hoja de detalle no la cierran
  if(t.dataset.a==='detCerrar'&&e.target.closest('[data-stop]'))return;
  const f=A[t.dataset.a];if(!f)return;
  e.preventDefault();f(t.dataset.v);
});

async function guardarMov(){
  const n=S.nuevo,x=calcNuevo();
  if(!x.listo||n.guardando)return;
  n.guardando=true;
  const b=document.getElementById('nvGuardar');b.disabled=true;b.textContent='Guardando…';
  const fila={tipo:n.tipo,cuenta:n.dest,monto:(x.c/100).toFixed(2),afecta_tarjeta:n.dest==='bam'?true:(n.tipo==='retiro'?!!n.afecta:false)};
  let r;try{r=await sb.from('cr_movimientos').insert(fila);}catch(e){r={error:e};}
  n.guardando=false;
  if(r.error){
    n.err=/fetch|network|Failed/i.test(String(r.error.message||''))?'No se guardó: no hay conexión. Intenta otra vez.':'No se guardó. Intenta otra vez.';
    b.disabled=false;b.textContent='Guardar movimiento';document.getElementById('nvErr').textContent=n.err;return;
  }
  await recargar();
  S.pantalla='panel';render();toast('Movimiento guardado');
}
async function anularMov(){
  const d=S.det;if(!d||d.anulando)return;
  d.anulando=true;render();
  let r;try{r=await sb.from('cr_movimientos').update({anulado:true,anulado_en:new Date().toISOString()}).eq('id',d.id);}catch(e){r={error:e};}
  if(r.error){d.anulando=false;render();toast('No se pudo eliminar. Revisa tu internet.');return;}
  S.det=null;await recargar();render();toast('Movimiento eliminado');
}
async function guardarAcceso(k){
  const a=S.accesos[k];
  S.accMsg[k]={guardando:true};render();
  let r;try{r=await sb.rpc('cr_guardar_acceso',{p_caja:k,p_nombre:a.nombre,p_usuario:a.usuario,p_clave:a.clave,p_activo:a.activo});}catch(e){r={error:e};}
  if(r.error){S.accMsg[k]={ok:false,txt:'No se pudo guardar. Revisa tu internet.'};render();return;}
  if(!r.data||!r.data.ok){S.accMsg[k]={ok:false,txt:(r.data&&r.data.error)||'No se pudo guardar.'};render();return;}
  if(a.clave)a.tiene=true;
  a.clave='';
  S.accMsg[k]={ok:true,txt:r.data.sesiones_cerradas?'Guardado. Se cerró la sesión abierta en su teléfono.':'Guardado.'};
  render();
}
async function guardarSaldos(){
  const v=S.saldosEd,btn=document.getElementById('slBtn'),err=document.getElementById('slErr');
  const filas=['bam','ss','sr'].map(k=>{const c=montoACent(v[k].txt);return {id:k,c:v[k].neg?-c:c};});
  btn.disabled=true;btn.textContent='Guardando…';err.textContent='';
  for(const f of filas){
    let r;try{r=await sb.from('cr_cuentas').update({saldo_inicial:(f.c/100).toFixed(2),configurada:true,actualizado:new Date().toISOString()}).eq('id',f.id);}catch(e){r={error:e};}
    if(r.error){btn.disabled=false;btn.textContent='Guardar saldos';err.textContent='No se guardó. Revisa tu internet e intenta otra vez.';return;}
  }
  S.primeraVez=false;
  await recargar();
  S.pantalla='panel';render();toast('Saldos guardados');
}

// ===== PDF =====
let _pdfCarga=null;
function cargarPdf(){
  if(window.jspdf)return Promise.resolve();
  if(_pdfCarga)return _pdfCarga;
  _pdfCarga=new Promise((ok,mal)=>{const s=document.createElement('script');s.src=PDF_LIB;s.onload=()=>ok();s.onerror=()=>{_pdfCarga=null;mal(new Error('No se pudo cargar el generador de PDF. Revisa tu internet.'));};document.head.appendChild(s);});
  return _pdfCarga;
}
// El PDF usa letras estándar: guion normal en vez del signo menos
const p$=c=>(c<0?'-':'')+fmt(c);
async function hacerPdf(){
  const b=document.getElementById('btnPdf');if(!b||b.disabled)return;
  b.disabled=true;const txt=b.innerHTML;b.innerHTML=I.pdf+'Preparando…';
  try{
    await cargarPdf();
    const g=S.reg,d=regDatos();
    const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'});
    const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=40;
    const nombreCta={todo:'Todas las cuentas',bam:'Tarjeta BAM',ss:'Caja Santa Sofía',sr:'Caja San Rafael'}[g.cuenta];
    const ahora=new Date();
    let y=M;
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(74,60,192);doc.text('CAJAS RURALES',M,y);
    y+=20;doc.setFontSize(18);doc.setTextColor(21,24,43);doc.text('Reporte de movimientos',M,y);
    y+=22;doc.setFontSize(10);
    const info=[['Cuenta',nombreCta],['Periodo',isoTxt(g.desde)+' al '+isoTxt(g.hasta)],['Generado',isoTxt(iso(ahora))+', '+horaDe(ahora.getTime())]];
    info.forEach(r=>{doc.setFont('helvetica','normal');doc.setTextColor(78,84,112);doc.text(r[0],M,y);doc.setFont('helvetica','bold');doc.setTextColor(21,24,43);doc.text(r[1],M+70,y);y+=15;});
    y+=6;
    const saldos=g.cuenta==='todo'?[['bam'],['ss'],['sr']].map(k=>[N[k[0]],S.saldo[k[0]]]):[[N[g.cuenta],S.saldo[g.cuenta]]];
    doc.setDrawColor(227,229,238);doc.setLineWidth(1);
    doc.roundedRect(M,y,W-2*M,saldos.length*20+8,6,6);
    let yy=y+18;
    saldos.forEach(s=>{doc.setFont('helvetica','normal');doc.setTextColor(78,84,112);doc.text('Saldo actual · '+s[0],M+12,yy);doc.setFont('helvetica','bold');doc.setTextColor(21,24,43);doc.text('Q '+p$(s[1]),W-M-12,yy,{align:'right'});yy+=20;});
    y+=saldos.length*20+22;
    const tot=[['Movimientos',String(d.lista.length),[21,24,43]],['Total retiros',(d.ret?'-':'')+fmt(d.ret),[180,35,24]],['Total abonos',(d.abo?'+':'')+fmt(d.abo),[6,118,71]]];
    const cw=(W-2*M-16)/3;
    tot.forEach((t,i)=>{const x=M+i*(cw+8);doc.setFillColor(243,244,248);doc.roundedRect(x,y,cw,40,6,6,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(78,84,112);doc.text(t[0].toUpperCase(),x+10,y+15);
      doc.setFontSize(12);doc.setTextColor(t[2][0],t[2][1],t[2][2]);doc.text(t[1],x+10,y+31);});
    y+=58;
    const col=[{t:'Fecha',x:M},{t:'Hora',x:M+84},{t:'Movimiento',x:M+122},{t:'Cuenta',x:M+240},{t:'Monto',x:W-M-100,a:'right'},{t:'Saldo',x:W-M,a:'right'}];
    const encabezado=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(78,84,112);
      col.forEach(c=>doc.text(c.t.toUpperCase(),c.x,y,c.a?{align:c.a}:undefined));y+=6;doc.setDrawColor(21,24,43);doc.setLineWidth(1.2);doc.line(M,y,W-M,y);y+=14;};
    encabezado();
    doc.setFontSize(9.5);
    if(!d.lista.length){doc.setFont('helvetica','normal');doc.setTextColor(78,84,112);doc.text('Sin movimientos en este periodo.',M,y);}
    d.lista.forEach(m=>{
      if(y>H-M-20){doc.addPage();y=M;encabezado();doc.setFontSize(9.5);}
      const r=m.tipo==='retiro',x=S.sal[m.id];
      const saldo=g.cuenta==='bam'?x.bam:g.cuenta==='todo'?(m.cuenta!=='bam'?x.caja:x.bam):x.caja;
      doc.setFont('helvetica','normal');doc.setTextColor(21,24,43);
      const dt=new Date(m.ts);
      doc.text(DIAS_C[dt.getDay()]+' '+dt.getDate()+' '+MESES[dt.getMonth()].slice(0,3)+' '+dt.getFullYear(),M,y);
      doc.text(horaDe(m.ts),M+84,y);
      doc.text(tituloDe(m).replace(' · ',' '),M+122,y);
      doc.text(NC[m.cuenta],M+240,y);
      doc.setFont('helvetica','bold');doc.setTextColor(r?180:6,r?35:118,r?24:71);
      doc.text((r?'-':'+')+fmt(m.monto),W-M-100,y,{align:'right'});
      doc.setTextColor(21,24,43);doc.text(p$(saldo),W-M,y,{align:'right'});
      y+=6;doc.setDrawColor(238,240,245);doc.setLineWidth(.8);doc.line(M,y,W-M,y);y+=14;
    });
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,126,150);doc.text('Página '+i+' de '+n,W-M,H-22,{align:'right'});}
    const archivo=('Cajas Rurales - '+nombreCta+' - '+g.desde+' al '+g.hasta+'.pdf').replace(/[\/\\:]/g,'-');
    doc.setProperties({title:archivo.replace(/\.pdf$/,'')});
    const blob=doc.output('blob');
    window.__ultimoPdf={nombre:archivo,blob:blob};
    try{const file=new File([blob],archivo,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:archivo.replace(/\.pdf$/,'')});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
    doc.save(archivo);
  }catch(e){toast(e.message||'No se pudo hacer el PDF');}
  finally{const bb=document.getElementById('btnPdf');if(bb){bb.disabled=false;bb.innerHTML=txt;}}
}

// ===== Actualización automática y datos al volver a la app =====
async function versionPublicada(){
  try{const r=await fetch(location.pathname+'?nv='+Date.now(),{cache:'no-store'});if(!r.ok)return null;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);return m?m[1]:null;}catch(e){return null;}
}
async function revisarVersion(){
  const v=await versionPublicada();
  if(v&&v!==VERSION&&!['nuevo','saldos','ajustes'].includes(S.pantalla)&&!S.det)location.replace(location.pathname+'?v='+encodeURIComponent(v));
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  revisarVersion();
  if(S.modo==='enc'&&S.pantalla==='enc'){const tok=tokenGuardado();if(!tok)return;
    const r=await cargarEnc(tok);if(r===false){S.modo=null;S.loginErr='Tu sesión terminó. Vuelve a entrar.';S.pantalla='login';}render();}
  if(S.modo==='admin'&&(S.pantalla==='panel'||S.pantalla==='reg'||S.pantalla==='prev')&&!S.det){if(await recargar())render();}
});

iniciar();
